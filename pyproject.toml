[project]
name = "clustering-12-000-power-plants-finding-natural-groups-in-energy-data"
version = "0.1.0"
description = "Companion code for Medium article: clustering 12 000 power plants finding natural groups in energy data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hdbscan>=0.8.40",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
